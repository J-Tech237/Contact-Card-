<style>
:root{

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--text);
  background:linear-gradient(180deg,#0e0e7a 0%,#06063a 40%,#03031f 100%) fixed;
  min-height:100vh;
  padding:max(48px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom));
}
main{max-width:440px;margin:0 auto;text-align:center}

.avatar{
  width:104px;height:104px;border-radius:50%;
  border:3px solid #17a99a;
  margin:0 auto 26px;
  position:relative;overflow:hidden;
  background:#1b1b8f;
  display:flex;align-items:center;justify-content:center;
  font-size:36px;font-weight:700;color:var(--teal);
}
/* Put a file called photo.jpg next to index.html to show your photo */
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

h1{font-size:32px;font-weight:600;margin:0 0 18px;letter-spacing:-.5px}
.role{
  color:var(--teal);font-weight:600;font-size:13px;
  letter-spacing:.3em;text-transform:uppercase;margin:0 0 14px;
}
.sub{color:var(--violet);font-size:19px;font-weight:500;margin:0 0 34px}

.links{display:flex;flex-direction:column;gap:14px}
a.item{
  display:flex;align-items:center;gap:16px;text-align:left;
  background:var(--card);border:1px solid var(--card-border);
  border-radius:24px;padding:20px 22px;
  color:var(--text);text-decoration:none;
  transition:transform .15s ease,border-color .15s ease;
}
a.item:active{transform:scale(.98);border-color:var(--teal)}
a.item svg{width:26px;height:26px;flex:none;stroke:var(--teal);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.t{font-size:19px;font-weight:600;word-break:break-word}
.s{font-size:16px;color:var(--violet);margin-top:3px;word-break:break-word}

a.save{
  display:block;margin-top:22px;padding:17px;border-radius:24px;
  background:var(--teal);color:#03031f;font-weight:700;font-size:18px;text-decoration:none;
}
a.save:active{opacity:.85}
